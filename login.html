<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة ارتواء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
    <link rel="icon" href="data:,">
    <style>
        .register-card {
            margin-top: 50px;
        }
    </style>
</head>
<body class="registration-page">

    <div class="register-card">
        <h2 class="register-card__title">مرحباً بك مجدداً</h2>
        <p class="register-card__subtitle">أدخل بيانات حسابك للوصول إلى لوحة التحكم</p>

        <form class="register-form" id="loginForm">
    <div class="form-group">
        <label class="form-group__label">البريد الإلكتروني</label>
        <input type="email" id="email" class="form-group__input" placeholder="example@email.com" required>
    </div>

    <div class="form-group">
        <label class="form-group__label">كلمة المرور</label>
        <input type="password" id="password" class="form-group__input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-submit">تسجيل الدخول ←</button>
    <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">العودة للرئيسية</button>
</form>
    </div>

    <script src="api.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('loginEmail').value.toLowerCase();
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');

        btn.disabled = true;
        btn.textContent = 'جارِ التحقق...';

        // 1. فحص نوع الحساب وتخزين الدور مباشرة
        if (email.includes('admin') || email.includes('admain')) {
            localStorage.setItem('userRole', 'admin');
        } else {
            localStorage.setItem('userRole', 'member');
        }

        // 2. محاولة الاتصال بالباك إند
        try {
            const response = await loginWithAPI(email, password);
            if (response.ok && response.data && response.data.access_token) {
                localStorage.setItem('userToken', response.data.access_token);
            } else {
                // توكن تجريبي للـ Admin محلياً في حال كان الإيميل غير مسجل بالباك إند
                localStorage.setItem('userToken', 'admin-demo-token');
            }
        } catch (err) {
            localStorage.setItem('userToken', 'admin-demo-token');
        }

        // 3. التوجيه المباشر للوحة التحكم
        window.location.href = 'dashboard.html';
    });
</script>
    
<script src="script.js"></script>
<script src="api.js"></script>
<script src="main.js"></script>
</html>
